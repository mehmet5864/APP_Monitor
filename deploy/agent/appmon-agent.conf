# APP_MON ajan yapılandırma dosyası (örnek)
# Kurulu konum: /etc/appmon-agent.conf   (değişiklikten sonra: sudo systemctl restart appmon-agent)
# Bu dosyayla kurulum: sudo ./appmon-agent -config appmon-agent.conf -install
# ANAHTAR=değer satırlarıdır; # ile başlayan satır yorumdur.

# --- Bağlantı ---
APM_SERVER=http://apm.firma.local:8080
APM_KEY=BURAYA_AGENT_ANAHTARI
#APM_NAME=ERP-DB-01
#APM_INTERVAL=15
#APM_CA_FILE=
#APM_INSECURE=true
# Yönetici Ajanlar sayfasından gönderilen veri seçimini uzaktan değiştirebilir; bu satır (off) bunu bu makinede yasaklar:
#APM_REMOTE_CONFIG=off

# --- İzlenecekler ---
#APM_WATCH=nginx,sshd
#APM_PG_DSN=postgres://izleme:PAROLA@127.0.0.1:5432/uygulama_db?sslmode=disable   (PostgreSQL sorgu istatistikleri; birden çok için ;; ile ayırın; izleme kullanıcısına pg_monitor rolü verin)
#APM_LOG=hata::/var/log/uygulama.log::(?i)error
#APM_ROOT=true

# ---------------------------------------------------------------------------
# Sunucuya gönderilecek veriler. Bir satırın başına # koyarsanız o veri GÖNDERİLMEZ.
# (Değişiklikten sonra ajanı yeniden başlatın. agent.up kalp atışı her zaman gönderilir.)
# ---------------------------------------------------------------------------
# CPU kullanımı (host.cpu_pct)
SEND_HOST_CPU=1
# Bellek ve swap kullanımı (host.mem_pct, host.swap_pct)
SEND_HOST_MEM=1
# Disk doluluğu, her sürücü/bağlama noktası (host.disk_pct)
SEND_HOST_DISK=1
# Yük ortalaması, Linux (host.load1, host.load5, host.load15)
SEND_HOST_LOAD=1
# Ağ trafiği, bayt/sn (host.net_rx_bps, host.net_tx_bps)
SEND_HOST_NET=1
# Süreç sayısı (host.procs)
SEND_HOST_PROCS=1
# Açık kalma süresi (host.uptime_s)
SEND_HOST_UPTIME=1
# APM_WATCH ile izlenen süreçlerin var/yok ve adet metrikleri (proc.<ad>.*)
SEND_WATCH=1
# APM_LOG ile tanımlı günlük desenlerinin eşleşme sayıları (log.<ad>.count)
SEND_LOGCOUNT=1
# Uygulama keşfi: çalışan süreç/servis/port listesi, uygulama CPU/bellek metrikleri, otomatik günlük sayımı
SEND_APPS=1
# Bağlantı tabanlı servis haritası: süreçlerin giden TCP bağlantı özeti (SEND_APPS ile birlikte çalışır)
SEND_CONNS=1
# Web sunucusu (nginx/Apache/IIS) erişim günlüğünden istek/hata/gecikme özeti (içerik/IP gönderilmez)
SEND_WEBLOG=1
# Veritabanı sorgu istatistikleri: PostgreSQL pg_stat_statements özeti (yalnızca APM_PG_DSN tanımlıysa; parola sunucuya gitmez)
SEND_DBSTATS=1
# Yerel OpenTelemetry alıcısı: uygulamaların trace'lerini 127.0.0.1:4318'den alıp sunucuya iletir
SEND_OTLP=1
# Uzaktan ajan güncellemesi (sunucunun önerdiği sürüme kendini günceller)
SEND_UPDATE=1
