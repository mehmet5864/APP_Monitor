services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: appmon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: appmon
    volumes:
      - appmon-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appmon -d appmon"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APM_DB_DSN: postgres://appmon:${POSTGRES_PASSWORD}@db:5432/appmon?sslmode=disable
      APM_MODE: ${APM_MODE:-onprem}
      APM_ADMIN_KEY: ${APM_ADMIN_KEY}
      APM_ASSET_LIMIT: ${APM_ASSET_LIMIT:-25}
      APM_RETENTION_DAYS: ${APM_RETENTION_DAYS:-14}
      APM_BROWSER_ENABLED: ${APM_BROWSER_ENABLED:-true}
    shm_size: "512mb"   # Chromium için paylaşımlı bellek
    sysctls:
      net.ipv4.ping_group_range: "0 2147483647"   # kök olmadan ICMP (ping) probe'u için
    extra_hosts:
      - "host.docker.internal:host-gateway"   # ana makinedeki uygulamaları izlemek için
    ports:
      - "${APM_PORT:-8080}:8080"

volumes:
  appmon-db:
